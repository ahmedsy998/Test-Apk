name: Build SyriaTel Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    name: Build & Upload Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages & Accept Licenses
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null

          if ! sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /tmp/sdkmanager_install.log 2>&1; then
            echo "=== ERROR: Android SDK Package Installation Failed ==="
            echo "ANDROID_HOME: $ANDROID_HOME"
            echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
            echo "sdkmanager version:"
            sdkmanager --sdk_root="$ANDROID_HOME" --version || true
            echo "=== Full sdkmanager Error Output ==="
            cat /tmp/sdkmanager_install.log || true
            echo "=== Available SDK Repositories & Packages ==="
            sdkmanager --sdk_root="$ANDROID_HOME" --list || true
            exit 1
          fi
          cat /tmp/sdkmanager_install.log

      - name: Verify Android SDK Directories
        run: |
          set -e
          for dir in "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/platforms/android-35" "$ANDROID_HOME/build-tools/35.0.0"; do
            if [ ! -d "$dir" ]; then
              echo "ERROR: Required Android SDK directory is missing: $dir"
              exit 1
            fi
            echo "Verified SDK directory exists: $dir"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install npm Dependencies
        run: npm install --ignore-scripts

      - name: Build Application
        run: npm run build

      - name: Synchronize Capacitor Android
        run: npx cap sync android || npm run cap:sync

      - name: Prepare Debug Keystore
        run: |
          set -e
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK using Gradle
        run: |
          set -e
          if [ -f settings.gradle.kts ] || [ -f build.gradle.kts ]; then
            gradle :app:assembleDebug --no-daemon
            mkdir -p android/app/build/outputs/apk/debug
            cp -f app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/app-debug.apk
          elif [ -d android ]; then
            cd android
            gradle assembleDebug --no-daemon
          else
            echo "ERROR: No Gradle project found to build APK."
            exit 1
          fi

      - name: Verify Debug APK File
        run: |
          set -e
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Expected APK not found at android/app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Syriatel-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
