name: Build SyriaTel Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    name: Build, Sign & Verify SyriaTel APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages & Accept Licenses
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null

          if ! sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /tmp/sdkmanager_install.log 2>&1; then
            echo "=== ERROR: Android SDK Package Installation Failed ==="
            echo "ANDROID_HOME: $ANDROID_HOME"
            echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
            echo "sdkmanager version:"
            sdkmanager --sdk_root="$ANDROID_HOME" --version || true
            echo "=== Full sdkmanager Error Output ==="
            cat /tmp/sdkmanager_install.log || true
            echo "=== Available SDK Repositories & Packages ==="
            sdkmanager --sdk_root="$ANDROID_HOME" --list || true
            exit 1
          fi

          # Also install API 36 / build-tools 36.0.0 when available for root Gradle builds
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0" >> /tmp/sdkmanager_install.log 2>&1 || true
          cat /tmp/sdkmanager_install.log

      - name: Verify Android SDK Directories
        run: |
          set -e
          for dir in "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/platforms/android-35" "$ANDROID_HOME/build-tools/35.0.0"; do
            if [ ! -d "$dir" ]; then
              echo "ERROR: Required Android SDK directory is missing: $dir"
              exit 1
            fi
            echo "Verified SDK directory exists: $dir"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install npm Dependencies
        run: npm install --ignore-scripts

      - name: Build Web Assets
        run: npm run build

      - name: Synchronize Capacitor Android Project
        run: |
          set -e
          if [ ! -d android ] && [ ! -f settings.gradle.kts ]; then
            npx cap add android
          fi
          npx cap sync android || npm run cap:sync

      - name: Prepare Debug Keystore
        run: |
          set -e
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build & Sign Debug APK (v1 + v2 + v3)
        run: |
          set -e
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools: $BUILD_TOOLS_DIR"

          if [ -f settings.gradle.kts ] || [ -f build.gradle.kts ]; then
            gradle :app:assembleDebug --no-daemon
            mkdir -p android/app/build/outputs/apk/debug
            cp -f app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/app-debug-unaligned.apk
          elif [ -d android ]; then
            cd android
            chmod +x gradlew || true
            if [ -f ./gradlew ]; then
              ./gradlew assembleDebug --no-daemon
            else
              gradle assembleDebug --no-daemon
            fi
            cd ..
            cp -f android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/app-debug-unaligned.apk
          else
            echo "ERROR: No Gradle project found to build APK."
            exit 1
          fi

          # Page-align (4-byte alignment) and sign with v1 (JAR), v2, and v3 schemes for universal Android 14 compatibility
          "$BUILD_TOOLS_DIR/zipalign" -p -f -v 4 \
            android/app/build/outputs/apk/debug/app-debug-unaligned.apk \
            android/app/build/outputs/apk/debug/app-debug.apk > /dev/null

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            android/app/build/outputs/apk/debug/app-debug.apk

          rm -f android/app/build/outputs/apk/debug/app-debug-unaligned.apk

      - name: Build Signed Release APK (When Secrets Configured)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release signing secrets detected. Building signed release APK..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            export KEYSTORE_PATH="$PWD/release-keystore.jks"
            if [ -f settings.gradle.kts ] || [ -f build.gradle.kts ]; then
              gradle :app:assembleRelease --no-daemon
              mkdir -p android/app/build/outputs/apk/release
              cp -f app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/app-release.apk
            elif [ -d android ]; then
              cd android
              gradle assembleRelease --no-daemon
              cd ..
            fi
            rm -f release-keystore.jks
          else
            echo "No release signing secrets configured; skipping release APK build."
          fi

      - name: Full 10-Step APK Integrity & Signature Audit
        run: |
          set -e
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          echo "=== 1. Verify APK File Exists ==="
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

          echo "=== 2. Verify APK Is Not Empty or Corrupted ==="
          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "APK File Size: $APK_SIZE bytes"
          if [ "$APK_SIZE" -lt 100000 ]; then
            echo "ERROR: APK file size ($APK_SIZE bytes) is abnormally small!"
            exit 1
          fi

          echo "=== 3. Verify Valid ZIP/APK Archive & Required Entries ==="
          unzip -t "$APK_PATH" > /dev/null
          unzip -l "$APK_PATH" | grep -E "AndroidManifest.xml|classes.dex"

          echo "=== 4 & 5. Verify APK Signature & Certificate with apksigner ==="
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK_PATH"

          echo "=== 6, 8 & 9. Verify Package Metadata, minSdkVersion, targetSdkVersion, and Package Name ==="
          BADGING=$("$BUILD_TOOLS_DIR/aapt2" dump badging "$APK_PATH")
          echo "$BADGING" | head -n 25
          echo "$BADGING" | grep "name='com.syriatel.mobile'"
          echo "$BADGING" | grep "minSdkVersion:"

          echo "=== 7. Verify 4-Byte APK Alignment with zipalign ==="
          "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$APK_PATH" | tail -n 5

          echo "=== 10. Confirm Binary APK Format (Not AAB or HTML) ==="
          file "$APK_PATH"

      - name: Upload SyriaTel-Android-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyriaTel-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
